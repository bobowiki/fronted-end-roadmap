<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>React Demo</title>
  <!-- 引入 React 和 ReactDOM（使用官方 CDN） -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- 引入 Babel，用于支持 JSX 语法 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <!-- 这里写 React 代码 -->
  <script type="text/babel">
    function App() {
      const [count, setCount] = React.useState(0);
      const [name, setName] = React.useState('张三')

      // 自变量导致因变量发生变化，并且会进行结果缓存，不需要每次都去计算，只在自变量发生变化时才重新计算
      const i = React.useMemo(() => {
        return count % 2 === 0 ? '偶数' : '奇数'
      }, [count])

      // 每次组件渲染都会重新计算，没有缓存
      const b = count % 2 === 0 ? '偶数' : '奇数'

      return (
        <div style={{ textAlign: "center", marginTop: "50px" }}>
          <h1>Hello React!</h1>
          <input value={name} onChange={e => setName(e.target.value)} />
          <p>当前计数：{count}</p>
          <button onClick={() => setCount(count + 1)}>点我加一</button>
          <p>{i}</p>
          <p>{b}</p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
