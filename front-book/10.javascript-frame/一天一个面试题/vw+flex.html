<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H5 VW 响应式示例</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            background: #f6f7f9;
            color: #333;
        }

        .page {
            max-width: 540px;
            /* 大屏兜底 */
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .header {
            height: 12vw;
            /* 约 45px */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }

        .content {
            flex: 1;
            padding: 4vw;
        }

        .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4vw;
        }

        .card {
            width: 44vw;
            background: #f2f3f5;
            border-radius: 2vw;
            padding: 4vw;
        }

        .card-title {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 12px;
            color: #666;
        }

        .footer {
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #eee;
            background: #fff;
            padding-top: 3vw;
            padding-bottom: calc(3vw + env(safe-area-inset-bottom));
        }

        .btn {
            width: 90%;
            height: 10vw;
            max-height: 44px;
            background: #1677ff;
            color: #fff;
            border-radius: 999px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="header">VW 响应式 H5</div>

        <div class="content">
            <div class="card-list">
                <div class="card">
                    <div class="card-title">商品 A</div>
                    <div class="card-desc">描述信息</div>
                </div>
                <div class="card">
                    <div class="card-title">商品 B</div>
                    <div class="card-desc">描述信息</div>
                </div>
                <div class="card">
                    <div class="card-title">商品 C</div>
                    <div class="card-desc">描述信息</div>
                </div>
                <div class="card">
                    <div class="card-title">商品 D</div>
                    <div class="card-desc">描述信息</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="btn">立即订阅</div>
        </div>
    </div>
</body>

</html>
